[tool.poetry]
name = "flwu"
version = "0.1.0"
description = "Florida Litigator Weekly Update"
authors = ["Cade Spivey"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "flwu", from = "src" },
    { include = "release-and-recovery.md", from = "skills/florida-update/references", to = "flwu/data/verification", format = "wheel" },
    { include = "review-rules.md", from = "skills/florida-update/references", to = "flwu/data/verification", format = "wheel" },
]
include = [
    { path = "skills/florida-update/references/release-and-recovery.md", format = "sdist" },
    { path = "skills/florida-update/references/review-rules.md", format = "sdist" },
]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.0"
pypdf = "^4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[tool.poetry.scripts]
flwu = "flwu.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
