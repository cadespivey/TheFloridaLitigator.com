          - strong [ref=f12e52]: County Court
        - list [ref=f12e53]:
          - listitem [ref=f12e54]: Handles violations of county and city ordinances
          - listitem [ref=f12e55]: Misdemeanors, or minor offenses that could lead to a maximum sentence of one year in the county jail
          - listitem [ref=f12e56]: Civil cases involving amounts of $15,000 or less, such as landlord-tenant or small claims disputes
          - listitem [ref=f12e57]: All traffic violations
        - heading [level=2] [ref=f12e58]:
          - strong [ref=f12e59]: Circuit Court
        - list [ref=f12e60]:
          - listitem [ref=f12e61]: Hears family cases, such as dissolution of marriage, guardianship, and juvenile delinquency
          - listitem [ref=f12e62]: Felony offenses
          - listitem [ref=f12e63]: "Probate matters: Examples of which are the processing of wills and settling estates"
          - listitem [ref=f12e64]: Civil cases involving a dispute of more than $15,000
          - listitem [ref=f12e65]: Appeals from the County Court
