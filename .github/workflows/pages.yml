{
  "name": "GitHub Pages",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "website/updates/**",
        "website/county-directories/**",
        "src/flwu/**",
        "pyproject.toml",
        ".github/workflows/pages.yml"
      ]
    },
    "pull_request": {
      "paths": [
        "website/updates/**",
        "website/county-directories/**",
        "src/flwu/**",
        "tests/**",
        "pyproject.toml",
        ".github/workflows/pages.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pages-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v6"
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install",
          "run": "python -m pip install . pytest"
        },
        {
          "name": "Test",
          "run": "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q"
        },
        {
          "name": "Build reviewed public archive",
          "run": "PYTHONDONTWRITEBYTECODE=1 flwu publish --archive website/updates --output build/site --county-directory website/county-directories/alachua.json --county-directory website/county-directories/bay.json --county-directory website/county-directories/brevard.json --county-directory website/county-directories/broward.json --county-directory website/county-directories/charlotte.json --county-directory website/county-directories/citrus.json --county-directory website/county-directories/collier.json --county-directory website/county-directories/columbia.json --county-directory website/county-directories/duval.json --county-directory website/county-directories/escambia.json --county-directory website/county-directories/flagler.json --county-directory website/county-directories/hendry.json --county-directory website/county-directories/hernando.json --county-directory website/county-directories/highlands.json --county-directory website/county-directories/hillsborough.json --county-directory website/county-directories/indian-river.json --county-directory website/county-directories/levy.json --county-directory website/county-directories/jackson.json --county-directory website/county-directories/lake.json --county-directory website/county-directories/lee.json --county-directory website/county-directories/leon.json --county-directory website/county-directories/manatee.json --county-directory website/county-directories/marion.json --county-directory website/county-directories/martin.json --county-directory website/county-directories/sumter.json --county-directory website/county-directories/suwannee.json --county-directory website/county-directories/gadsden.json --county-directory website/county-directories/okeechobee.json --county-directory website/county-directories/wakulla.json --county-directory website/county-directories/desoto.json --county-directory website/county-directories/baker.json --county-directory website/county-directories/bradford.json --county-directory website/county-directories/washington.json --county-directory website/county-directories/hardee.json --county-directory website/county-directories/taylor.json --county-directory website/county-directories/gilchrist.json --county-directory website/county-directories/holmes.json --county-directory website/county-directories/madison.json --county-directory website/county-directories/dixie.json --county-directory website/county-directories/union.json --county-directory website/county-directories/miami-dade.json --county-directory website/county-directories/monroe.json --county-directory website/county-directories/nassau.json --county-directory website/county-directories/okaloosa.json --county-directory website/county-directories/orange.json --county-directory website/county-directories/osceola.json --county-directory website/county-directories/palm-beach.json --county-directory website/county-directories/pasco.json --county-directory website/county-directories/pinellas.json --county-directory website/county-directories/polk.json --county-directory website/county-directories/putnam.json --county-directory website/county-directories/santa-rosa.json --county-directory website/county-directories/sarasota.json --county-directory website/county-directories/seminole.json --county-directory website/county-directories/st-lucie.json --county-directory website/county-directories/volusia.json --county-directory website/county-directories/walton.json"
        },
        {
          "uses": "actions/upload-pages-artifact@v4",
          "with": {
            "path": "build/site"
          }
        }
      ]
    },
    "deploy": {
      "if": "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'",
      "needs": "build",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "uses": "actions/configure-pages@v5"
        },
        {
          "name": "Deploy",
          "id": "deployment",
          "uses": "actions/deploy-pages@v4"
        }
      ]
    }
  }
}
