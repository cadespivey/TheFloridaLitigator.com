{
  "name": "Public credential guard",
  "on": [
    "push",
    "pull_request",
    "workflow_dispatch"
  ],
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "scan": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Verify patched Actions Node runtime",
          "shell": "bash",
          "run": "python3 - <<'PYGUARD'\nimport os, re, subprocess, hashlib, platform, tarfile, tempfile\nfrom pathlib import Path\npid = os.getpid()\nseen = set()\nwhile pid > 1 and pid not in seen:\n    seen.add(pid)\n    process = Path('/proc') / str(pid)\n    executable = (process / 'exe').resolve(strict=True)\n    if executable.name == 'Runner.Worker':\n        node = executable.parent.parent / 'externals/node24/bin/node'\n        version = subprocess.check_output([str(node), '--version'], text=True).strip()\n        match = re.fullmatch(r'v(\\d+)\\.(\\d+)\\.(\\d+)', version)\n        parsed = tuple(map(int, match.groups())) if match else ()\n        if parsed and parsed[0] == 24 and parsed < (24, 22, 1):\n            if platform.system() != 'Linux' or platform.machine() != 'x86_64':\n                raise SystemExit('Runtime patch supports Linux x86_64 hosted runners only')\n            with tempfile.TemporaryDirectory(prefix='actions-node-security-') as work:\n                archive = Path(work) / 'node.tar.xz'\n                subprocess.run(['curl', '--fail', '--silent', '--show-error', '--proto', '=https',\n                                '--tlsv1.2', '--max-time', '120', '--output', str(archive),\n                                'https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz'], check=True)\n                expected = '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6'\n                if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:\n                    raise SystemExit('Node archive checksum mismatch; refusing installation')\n                with tarfile.open(archive, 'r:xz') as bundle:\n                    member = bundle.getmember('node-v24.22.1-linux-x64/bin/node')\n                    if not member.isfile():\n                        raise SystemExit('Node archive binary is not a regular file')\n                    replacement = Path(work) / 'node'\n                    replacement.write_bytes(bundle.extractfile(member).read())\n                replacement.chmod(0o755)\n                if subprocess.check_output([str(replacement), '--version'], text=True).strip() != 'v24.22.1':\n                    raise SystemExit('Downloaded Node version mismatch')\n                subprocess.run(['sudo', '-n', 'install', '-m', '755', str(replacement), str(node)], check=True)\n            version = subprocess.check_output([str(node), '--version'], text=True).strip()\n            match = re.fullmatch(r'v(\\d+)\\.(\\d+)\\.(\\d+)', version)\n            parsed = tuple(map(int, match.groups())) if match else ()\n        if not parsed or parsed[0] != 24 or parsed < (24, 22, 1):\n            raise SystemExit('Unsafe or unrecognized Actions runtime: ' + version)\n        print('Verified Actions Node runtime:', version, 'at', node)\n        break\n    status = (process / 'status').read_text()\n    pid = int(next(line.split()[1] for line in status.splitlines() if line.startswith('PPid:')))\nelse:\n    raise SystemExit('Cannot locate Actions runner runtime; refusing JavaScript actions')\nPYGUARD"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "run": "python scripts/check_public_credentials.py"
        }
      ]
    }
  }
}
