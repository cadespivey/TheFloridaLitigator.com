{
  "name": "Public credential guard",
  "on": [
    "push",
    "pull_request",
    "workflow_dispatch"
  ],
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "scan": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Verify patched Actions Node runtime",
          "shell": "bash",
          "run": "python3 - <<'PYGUARD'\nimport os, re, subprocess\nfrom pathlib import Path\npid = os.getpid()\nseen = set()\nwhile pid > 1 and pid not in seen:\n    seen.add(pid)\n    process = Path('/proc') / str(pid)\n    executable = (process / 'exe').resolve(strict=True)\n    if executable.name == 'Runner.Worker':\n        node = executable.parent.parent / 'externals/node24/bin/node'\n        version = subprocess.check_output([str(node), '--version'], text=True).strip()\n        match = re.fullmatch(r'v(\\d+)\\.(\\d+)\\.(\\d+)', version)\n        parsed = tuple(map(int, match.groups())) if match else ()\n        if not parsed or parsed[0] != 24 or parsed < (24, 22, 1):\n            raise SystemExit('Unsafe or unrecognized Actions runtime: ' + version)\n        print('Verified Actions Node runtime:', version, 'at', node)\n        break\n    status = (process / 'status').read_text()\n    pid = int(next(line.split()[1] for line in status.splitlines() if line.startswith('PPid:')))\nelse:\n    raise SystemExit('Cannot locate Actions runner runtime; refusing JavaScript actions')\nPYGUARD"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "run": "python scripts/check_public_credentials.py"
        }
      ]
    }
  }
}
